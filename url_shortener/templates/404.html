{% extends "base.html" %}

{% block title %}Page not found{% endblock title %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center text-center">
    <div class="col-md-8 col-lg-6">

      <div class="mb-4">
        <span class="display-1 fw-bold text-secondary">404</span>
      </div>

      <h1 class="h3 fw-bold mb-3">Page not found</h1>

      <p class="text-muted mb-4">
        {% if exception %}
          {{ exception }}
        {% else %}
          This short link doesn't exist, or the page you were looking for
          has moved.
        {% endif %}
      </p>

      <a href="{% url 'shortener:home' %}" class="btn btn-primary">Shorten a new link</a>

    </div>
  </div>
</div>
{% endblock content %}
